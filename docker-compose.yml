version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelsoc-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinelsoc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentinelsoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelsoc -d sentinelsoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelsoc-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://sentinelsoc:password@postgres:5432/sentinelsoc
      - SECRET_KEY=development_secret_key_change_in_production
      - ENVIRONMENT=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelsoc-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
